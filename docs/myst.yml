version: 1
extends:
  - https://raw.githubusercontent.com/myst-contrib/myst-contrib.github.io/main/docs/footer.yml
project:
  id: mystmd-client
  title: mystmd-client
  github: https://github.com/choldgraf/mystmd-client
  plugins:
    # Fixes relative links in the included README, which MyST would otherwise resolve against docs/.
    # Links to other repo files point to GitHub, using `github` above.
    - https://github.com/myst-contrib/myst-include-link-rewrites/releases/latest/download/index.mjs
  toc:
    - file: index.md
site:
  template: book-theme
  options:
    logo_text: mystmd-client
